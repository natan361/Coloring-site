name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Action majors are kept current: the v3/v4 line still bundles Node 20, which
      # GitHub has deprecated and now force-runs on Node 24, producing a warning on
      # every run.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # A project page is served from /<repo>/, so the bundle must be built with
        # that prefix. `github.event.repository.name` keeps it correct if the repo
        # is ever renamed. `postbuild` runs prerender.mjs, which gives every route a
        # real index.html so the host returns 200 rather than 404.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Fail if the build produced no route files
        # Cheap guard against silently publishing an empty or half-built site.
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/about/index.html || { echo "prerendered routes missing"; exit 1; }
          echo "dist looks good: $(find dist -name index.html | wc -l) route files"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
